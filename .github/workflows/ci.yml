name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install source-check dependencies
        run: pip install -e ".[dev]"
      - name: Check registered evaluation paths and configuration guards
        run: pytest tests/test_publication_evaluation.py tests/test_kino_naming.py -q
      - name: Lint evaluation wrapper and regression tests
        run: >-
          ruff check kino scripts/evaluate_kino_fail.py scripts/setup_kino_paths.py
          tests/test_publication_evaluation.py tests/test_kino_naming.py

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the Isaac Sim 5.x python on the GPU machine
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests (sim tests auto-skip without Isaac Lab)
        run: pytest -m "not slow" -q
      - name: Walking skeleton demo
        run: python scripts/run_demo.py --backend surrogate

  # Sim smoke job intentionally absent: no GPU runner available yet. The sim gate is
  # `pytest -m sim` run manually on the RTX 5090 machine and recorded in the
  # local test logs. Add a self-hosted GPU job here when one exists.
