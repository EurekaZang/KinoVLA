<html lang="en">
<head>
<meta charset="utf-8"/>

<style>
  :root{
    --bg:#f6f8fc; --panel:#ffffff; --ink:#1f2733; --muted:#697389; --line:#dbe1ec;
    --green:#0f8a52; --blue:#1f4fb0; --rust:#b25a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:#fff}
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:12.5px;color:var(--muted)}
  header .hint{margin-left:auto;font-size:12px;color:var(--muted)}
  .wrap{display:flex;height:calc(100% - 49px)}
  .stage{flex:1;position:relative;overflow:hidden;background:var(--bg)}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}
  aside{width:368px;min-width:368px;border-left:1px solid var(--line);background:var(--panel);
    padding:14px 16px;overflow:auto;font-size:13px;line-height:1.5}
  aside h2{font-size:14px;margin:0 0 4px;color:#15233f}
  aside .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;color:#fff;font-weight:700;margin-bottom:8px}
  aside .role{color:var(--muted);margin:0 0 10px}
  aside code,aside .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  aside .kv{margin:2px 0}
  aside .kv b{color:#1f3a78}
  aside .dim{color:var(--green);font-weight:600}
  aside hr{border:none;border-top:1px solid var(--line);margin:10px 0}
  aside .legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:middle}
  aside .lrow{margin:3px 0;color:var(--muted)}
  .controls{position:absolute;left:12px;top:12px;z-index:5;display:flex;gap:6px}
  .controls button{background:#fff;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,60,.06)}
  .controls button:hover{background:#eef2fb}
  .controls button.on{background:#e6eefc;border-color:#9db8ee;color:#1f4fb0;font-weight:600}
  .node rect.body{fill:#ffffff;stroke-width:1.6;filter:url(#nshadow)}
  .node rect.head{stroke:none}
  .node .title{font-size:13px;font-weight:700;fill:#1c2840}
  .node .spec{font-size:10px;fill:#ffffff;font-weight:700;opacity:.92}
  .node .role{font-size:10.5px;fill:#6a7589}
  .node{cursor:pointer}
  .link{fill:none}
  .elabel{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:#2a3550}
  .elabel.bg{fill:#f6f8fc;stroke:#f6f8fc;stroke-width:4.5;stroke-linejoin:round}
  .lane-label{font-size:13px;font-weight:800;fill:#9aa4ba;letter-spacing:1px}
  .dim-on{opacity:.12}
  .hl{opacity:1 !important}
</style>
</head>

 {id:"reflex",  lane:"on", g:"monitor", x:320, y:40, w:W,h:H, title:"Reflex + ActiveProbe", spec:"§6.9",

   <div class='kv'><b>ActiveProbe.command(obs)</b> → <span class='dim'>cmd (3,)</span></div>
   <div class='kv'>&nbsp;decel: [lo_mps=0.1, 0, 0] · accel/hold: [hi_mps=0.8, 0, 0]</div>
   <div class='kv'>settle_window=500 ms → refills proprio window IID w/ M6 (Gap-3 fix #34c)</div>`},
 {id:"map",     lane:"on", g:"map", x:600, y:40, w:W,h:H, title:"Semantic Traversability Map", spec:"§7",
   role:"RGB-D → costmap → planner crop",
   detail:`<div class='kv'><b>RgbdFrame</b>: rgb <span class='dim'>(72,96,3)</span> · range_m <span class='dim'>(72,96)</span> · ray_w <span class='dim'>(72,96,3)</span> · pos <span class='dim'>(3,)</span></div>
   <div class='kv'><b>encoder.embed(rgb)</b> → <span class='dim'>(E,)</span> L2-norm · E=64 pixel/surrogate, <b>512</b> real CLIP</div>
   <div class='kv'><b>ObservedRegion</b>: footprint Rect · embedding (E,) · appearance_class · visual_cost</div>
   <hr><div class='kv'><b>Costmap</b> grid <span class='dim'>(ny=40, nx=64)</span> @ 0.25 m, 16×10 m</div>
   <div class='kv'>&nbsp;_cost (40,64) f64 · _physical (40,64) bool · _observed (40,64) bool · _embed (40,64,E)</div>
   <div class='kv'><b>MapCrop</b>: cost <span class='dim'>(≤33,≤33)</span> · physical (≤33,≤33) · origin_xy (2,) · res 0.25</div>
   <div class='kv'><b>nav_hazards()</b> → list[(centre (2,), radius f)]</div>`},
 {id:"backend", lane:"on", g:"sim", x:40, y:180, w:W,h:H, title:"Isaac / Surrogate Backend", spec:"§8.1",
   role:"Go2 physics · O1–O11 apply θ",
   detail:`<div class='kv'><b>step(cmd_vel <span class='dim'>(3,)</span>)</b> = [vx,vy,wz] → <b>Obs</b></div>
   <div class='kv'><b>Obs</b> (12 fields):</div>
   <div class='kv mono'>&nbsp;pos(2) vel_body(2) cmd_prev(3) heading yaw_rate t<br>

   <hr><div class='kv'><b>get_privileged_state()</b> → dict{ "op_i.name.param": float }</div>
   <div class='kv'>&nbsp;per-op 3–9 scalars (region cx,cy,hx,hy + mechanism params)</div>
   <div class='kv'><b>privileged_physics()</b> → <span class='dim'>{mu, payload_kg, effort_scale, support_ratio}</span> = θ-truth (4 f)</div>
   <div class='kv'>O1 μ · O2 compliance · O3 collapse · O4 tether · O5 payload · O6 push · O7 visual-remap · O8 collider · O9 high-center · O10 effort-decay · O11 obs-bias</div>`},
 {id:"monitor", lane:"on", g:"monitor", x:320, y:180, w:W,h:H, title:"Kino-Monitor (rule v0)", spec:"§3",

   detail:`<div class='kv'>in <b>Obs</b> → 4 channels (EMA α=0.3, debounce, cooldown):</div>
   <div class='kv mono'>&nbsp;slip_ratio · tracking_error=‖cmd_prev[:2]−vel_body‖ · effort_ratio · tilt</div>
   <div class='kv'><b>step(obs)</b> → <b>MonitorEvent</b> | None</div>
   <div class='kv mono'>&nbsp;MonitorEvent{ t, pos(2), channel:str, value:f, threshold:f, summary:str }</div>
   <div class='kv'><b>anomaly_score</b> = maxₖ EMAₖ/thrₖ → <span class='dim'>float [0,∞)</span> (gates token injection)</div>`},
 {id:"extractor",lane:"on", g:"tokens", x:600, y:180, w:W,h:H, title:"Kino-Tokens Extractor", spec:"§4",

   detail:`<div class='kv'>in <b>proprio_window</b> <span class='dim'>(B,25,11)</span> raw</div>
   <div class='kv'>Conv1d[48,48] → kv 48→96 → Perceiver latents (K=6,96) → x-attn(4h)+FFN</div>
   <div class='kv'>MLP proj: <span class='dim'>96 → 512 → 2560</span></div>
   <div class='kv'><b>forward</b> → soft_tokens <span class='dim'>(B, K=6, vlm_dim=2560)</span> + θ_pred (B,4)</div>

   detail:`<div class='kv'>hidden_size <span class='dim'>2560</span> · LoRA r=16 α=32 drop .05 (~34.5 M trainable)</div>
   <div class='kv'>targets: q,k,v,o,gate,up,down_proj (lang tower)</div>
   <hr><div class='kv'><b>inputs</b> (latent route B5):</div>
   <div class='kv mono'>&nbsp;K=6 soft_tokens (6,2560) spliced at the kino slots via embed hook<br>
   &nbsp;RGB (5,72,96,3) deepstack-vision · MapCrop · text prompt</div>
   <div class='kv'>text route (B4): proprio as JSON — binned(256 tok)/scalar(54)/none</div>
   <div class='kv'><b>generate</b> → <span class='dim'>"&lt;Thought&gt;…&lt;/Thought&gt;&lt;Action&gt;{json}&lt;/Action&gt;"</span></div>
   <div class='kv'>loss: next-tok CE (loss_span=completion|action) + 0.1·θ-MSE</div>`},
 {id:"parser",  lane:"on", g:"vla", x:1160, y:340, w:W,h:H, title:"Output Parser", spec:"§10 exit-2",
   role:"parse-or-reject (100%)",
   detail:`<div class='kv'><b>parse_vla_decision(text)</b> → <b>ParsedDecision</b></div>
   <div class='kv mono'>&nbsp;ok=True → {attribution∈11, primitive∈7, params}<br>
   &nbsp;ok=False → reject_code = "REJECT_SCHEMA: …"</div>
   <div class='kv'>attribution ∈ {low_friction, compliant_terrain, region_collapse, adhesion, overload, effort_decay, external_push, invisible_obstacle, high_centering, obs_bias, nominal}</div>
   <div class='kv'>to_compiler_primitive(): pixel [u,v] → odometry [x,y] via depth-unproject</div>`},
 {id:"compiler",lane:"on", g:"shield", x:880, y:340, w:W,h:H, title:"Primitive Compiler", spec:"§5",
   role:"Action → admission-gated command",
   detail:`<div class='kv'>7 primitives: Backstep · Replan_Waypoint(point_px [u,v]) · Switch_Gait(mode) · Adjust_Posture(h,pitch) · Set_Constraint(v,k) · Update_Topology(xy,r,status) · Hold_and_Request(reason)</div>
   <div class='kv'><b>compile(prim,obs)</b> → <b>CompiledCommand</b>:</div>
   <div class='kv mono'>&nbsp;accepted:bool · code:str · v_cmd (3,)|None · target_mode|None<br>
   &nbsp;waypoint_xy (2,)|None · topology_op (x,y,r,status)|None<br>
   &nbsp;max_speed|None · stiffness|None · halt:bool · backstep_m|None</div>
   <div class='kv'>mode switch gated by CBF admission (h_min ≥ ε_switch)</div>`},
 {id:"shield",  lane:"on", g:"shield", x:600, y:340, w:W,h:H, title:"CBF-QP Safety Shield", spec:"§6",
   role:"LIP/DCM · 2-D QP projection",
   detail:`<div class='kv'><b>filter(cmd <span class='dim'>(3,)</span>, obs)</b>:</div>
   <div class='kv mono'>&nbsp;DCM ξ = p+v/ω ∈ ℝ² → u_nom = ξ+K_ξ(ξ−ξ_des) ∈ ℝ²</div>
   <div class='kv mono'>&nbsp;QP: min ½‖u−u_nom‖² s.t. A u ≤ b, A∈ℝ^(M×2), M = 4 CBF + 4 ZMP + 8 friction</div>
   <div class='kv mono'>&nbsp;→ u* ∈ ℝ² → back-solve v_cmd* ∈ ℝ² → out <span class='dim'>(3,)</span> [vx*,vy*,wz]</div>
   <div class='kv'><b>ShieldDecision</b>{ cmd (3,), intervened:bool, codes:tuple[str] }</div>
   <div class='kv'>μ̂ hook: set_mu_estimate(μ) tightens friction cone · p99 &lt; 1 ms</div>`},

 {id:"oracle",  lane:"off", g:"data", x:600, y:486, w:W,h:H, title:"Oracle LLM", spec:"§10 P3",

   detail:`<div class='kv'><b>build_prompt</b> → [system, user] (English)</div>

   detail:`<div class='kv'><b>GroundTruth</b> (frozen):</div>

 {id:"filter",  lane:"off", g:"data", x:880, y:560, w:W,h:H, title:"Truth-Consistency Filter", spec:"§10 P3",
   role:"the §10 contribution",
   detail:`<div class='kv'><b>evaluate(oracle_text, GT)</b> → (CoTAnnotation|None, <b>Verdict</b>)</div>

 {id:"dataset", lane:"off", g:"data", x:1160, y:560, w:W,h:H, title:"Dataset (JSONL + NPZ)", spec:"§10 P4",
   role:"manifest + frames + card",
   detail:`<div class='kv'><b>DataSample.to_record()</b>:</div>
   <div class='kv mono'>&nbsp;sample_id · snapshot{shapes} · ground_truth · annotation|None<br>
   &nbsp;verdict · target_theta <span class='dim'>[mu,payload_kg,effort_scale,support_ratio]</span><br>
   &nbsp;ambiguity_pair:str|None</div>
   <div class='kv'>files: samples.jsonl (kept) · dropped.jsonl · frames.npz (rgb/depth/proprio f32) · dataset_card.{json,md}</div>

   role:"LoRA + Projector on filtered CoT",
   detail:`<div class='kv'>split operator-stratified <span class='dim'>76/12/12</span> (≈315/49/49)</div>

   <div class='kv'>→ adapter_best (LoRA) + Kino-Projector · exit-1 attribution 0.974 vs FSM 0.237</div>`},
 {id:"dpo",     lane:"off", g:"vla", x:1720, y:560, w:W,h:H, title:"Embodied DPO", spec:"§11 S2",
   role:"physical-outcome preference",
   detail:`<div class='kv'><b>PreferencePair</b>{ snapshot, chosen_text, rejected_text, reason }</div>

   <div class='kv'>ref = LoRA-off (adapter toggle, cached) · <b>loss_span="action"</b> (Thought-confound fix #36)</div>`},
];

   det:"drive into the failure, intercept at locus, capture real proprioception + privileged θ"},
 {s:"snapshot",t:"oracle",   type:"data",    lab:"Snapshot {rgb,depth,proprio(25,11),θ}",
   det:"rgb(5,72,96,3), depth(5,72,96), proprio_window(25,11), pose(2), privileged_theta, monitor_channel"},
 {s:"snapshot",t:"gt",       type:"data",    lab:"operator + θ",
   det:"taxonomy maps (operator, θ) → category, A/B class, feasible recovery set, canonical primitive"},
 {s:"oracle",  t:"filter",   type:"data",    lab:"raw CoT → CoTAnnotation",
   det:"parsed {thought, attribution∈11, primitive{name∈7, params}}; may confabulate"},
 {s:"gt",      t:"filter",   type:"data",    lab:"GroundTruth {category,A/B,feasible}",
   det:"the privileged anchor the filter checks the Oracle's CoT against"},
 {s:"filter",  t:"dataset",  type:"data",    lab:"Verdict {keep, reason}",
   det:"KEEP → samples.jsonl ; DROP_* → dropped.jsonl (no-filter ablation) ; ORACLE_ERROR excluded"},
 {s:"dataset", t:"sft",      type:"train",   lab:"VlaExample (76/12/12) + target_θ(4)",
   det:"samples.jsonl + frames.npz → operator-stratified seeded split; target_theta=[mu,payload_kg,effort_scale,support_ratio]"},
 {s:"sft",     t:"dpo",      type:"train",   lab:"LoRA adapter + Kino-Projector",
   det:"SFT checkpoint initializes both the DPO policy and (adapter-off) the reference"},
 {s:"dpo",     t:"vlm",      type:"train", coff:[110,30], sa:"top", ta:"bottom", lab:"trained LoRA + Projector → deploy",
   det:"the §11 Embodied-DPO-tuned weights load into the online Qwen3-VL-4B planner"},
];

// ---------- render ----------
const svg = d3.select("#svg");
const defs = svg.append("defs");
// soft drop shadow for cards
const fil = defs.append("filter").attr("id","nshadow").attr("x","-20%").attr("y","-20%").attr("width","140%").attr("height","160%");
fil.append("feDropShadow").attr("dx",0).attr("dy",1.5).attr("stdDeviation",2.2).attr("flood-color","#1a2a4d").attr("flood-opacity",0.16);

const root = svg.append("g");
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));

// lane backgrounds + labels
const lanes = [
 {y:0,   h:452, label:"ONLINE CLOSED LOOP  ·  1kHz monitor → Kino-Tokens → VLA → CBF shield → execute", fill:"#eef3fc", stroke:"#dde6f6"},
 {y:470, h:280, label:"OFFLINE TRAINING  ·  Hindsight CoT collection → truth-filter → Kino-SFT → Embodied DPO", fill:"#eef6f0", stroke:"#dde9e0"},
];
root.selectAll("rect.lane").data(lanes).join("rect")
  .attr("class","lane").attr("x",-40).attr("width",2070)
  .attr("y",d=>d.y).attr("height",d=>d.h).attr("fill",d=>d.fill)
  .attr("stroke",d=>d.stroke).attr("rx",12);
root.selectAll("text.lane-label").data(lanes).join("text")
  .attr("class","lane-label").attr("x",-24).attr("y",d=>d.y+24).text(d=>d.label);

// arrow markers
const MARK = {data:"#6f7da6", feedback:"#2f6fc4", couple:"#7d5fc6", train:"#c24bb0", control:"#bf8a2c"};
Object.entries(MARK).forEach(([k,c])=>{
  defs.append("marker").attr("id","arw-"+k).attr("viewBox","0 -5 10 10")
   .attr("refX",9).attr("refY",0).attr("markerWidth",7).attr("markerHeight",7).attr("orient","auto")
   .append("path").attr("d","M0,-5L10,0L0,5").attr("fill",c);
});

function sideAnchor(n, side, tx, ty){
  const cx=n.x+n.w/2, cy=n.y+n.h/2;
  if(side==="top")    return [cx, n.y];
  if(side==="bottom") return [cx, n.y+n.h];
  if(side==="left")   return [n.x, cy];
  if(side==="right")  return [n.x+n.w, cy];
  const dx=tx-cx, dy=ty-cy;
  const sx = dx!==0 ? (n.w/2)/Math.abs(dx) : Infinity;
  const sy = dy!==0 ? (n.h/2)/Math.abs(dy) : Infinity;
  const s=Math.min(sx,sy);
  return [cx+dx*s, cy+dy*s];
}
function endpoints(d){
  const s=byId[d.s], t=byId[d.t];
  const sc=[s.x+s.w/2,s.y+s.h/2], tc=[t.x+t.w/2,t.y+t.h/2];
  // if a bulge is present, aim the auto-anchor at the control point so it exits the right side
  const aimT = d.coff ? [(sc[0]+tc[0])/2+d.coff[0],(sc[1]+tc[1])/2+d.coff[1]] : tc;
  const aimS = d.coff ? [(sc[0]+tc[0])/2+d.coff[0],(sc[1]+tc[1])/2+d.coff[1]] : sc;
  const a=sideAnchor(s, d.sa, aimT[0],aimT[1]);
  const b=sideAnchor(t, d.ta, aimS[0],aimS[1]);
  return [a,b];
}
function linkPath(d){
  const [a,b]=endpoints(d);
  if(!d.coff) return `M${a[0]},${a[1]} L${b[0]},${b[1]}`;
  const mx=(a[0]+b[0])/2+d.coff[0], my=(a[1]+b[1])/2+d.coff[1];
  return `M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}`;
}
function linkMid(d){
  const [a,b]=endpoints(d);
  if(!d.coff) return [(a[0]+b[0])/2,(a[1]+b[1])/2];
  const cx=(a[0]+b[0])/2+d.coff[0], cy=(a[1]+b[1])/2+d.coff[1];
  return [0.25*a[0]+0.5*cx+0.25*b[0], 0.25*a[1]+0.5*cy+0.25*b[1]];
}

// links
const linkG = root.append("g");
const linkSel = linkG.selectAll("path.link").data(links).join("path")
  .attr("class","link")
  .attr("d",linkPath)
  .attr("stroke",d=>MARK[d.type])
  .attr("stroke-width",d=>d.type==="train"||d.type==="feedback"?2.1:1.7)
  .attr("stroke-dasharray",d=>(d.type==="couple"||d.type==="control"||d.type==="train")?"6 4":null)
  .attr("opacity",.9)
  .attr("marker-end",d=>"url(#arw-"+d.type+")")
  .style("cursor","pointer")
  .on("mouseover",(e,d)=>showLink(d))
  .on("mouseout",resetPanel);

// edge labels
const labG = root.append("g");
const labSel = labG.selectAll("g.elab").data(links).join("g").attr("class","elab")
  .attr("transform",d=>{const m=linkMid(d);return `translate(${m[0]},${m[1]})`;});
labSel.append("text").attr("class","elabel bg").attr("text-anchor","middle").attr("dy","0.32em").text(d=>d.lab);
labSel.append("text").attr("class","elabel").attr("text-anchor","middle").attr("dy","0.32em").text(d=>d.lab);

// nodes
const nodeG = root.append("g");
const nodeSel = nodeG.selectAll("g.node").data(nodes).join("g")
  .attr("class",d=>"node N-"+d.id)
  .attr("transform",d=>`translate(${d.x},${d.y})`)
  .on("mouseover",(e,d)=>showNode(d))
  .on("mouseout",resetPanel);
nodeSel.append("rect").attr("class","body").attr("width",d=>d.w).attr("height",d=>d.h)
  .attr("rx",10).attr("stroke",d=>GROUPS[d.g].c);
nodeSel.append("path").attr("class","head")
  .attr("d",d=>`M0,10 a10,10 0 0 1 10,-10 l${d.w-20},0 a10,10 0 0 1 10,10 l0,16 l${-d.w},0 z`)
  .attr("fill",d=>GROUPS[d.g].c);
nodeSel.append("text").attr("class","title").attr("x",11).attr("y",43).text(d=>d.title);
nodeSel.append("text").attr("class","spec").attr("x",d=>d.w-9).attr("y",17).attr("text-anchor","end").text(d=>d.spec);
nodeSel.append("text").attr("class","role").attr("x",11).attr("y",62).text(d=>d.role);

// ---------- interactivity ----------
function dimAll(){ nodeSel.classed("dim-on",true); linkSel.classed("dim-on",true); labSel.classed("dim-on",true); }
function undimAll(){ nodeSel.classed("dim-on",false); linkSel.classed("dim-on",false); labSel.classed("dim-on",false); }

function showNode(d){
  dimAll();
  d3.select(".N-"+d.id).classed("dim-on",false).classed("hl",true);
  links.forEach((l)=>{
    if(l.s===d.id||l.t===d.id){
      linkSel.filter(x=>x===l).classed("dim-on",false).classed("hl",true);
      labSel.filter(x=>x===l).classed("dim-on",false);
      d3.select(".N-"+l.s).classed("dim-on",false);
      d3.select(".N-"+l.t).classed("dim-on",false);
    }
  });
  const ins = links.filter(l=>l.t===d.id), outs=links.filter(l=>l.s===d.id);
  panel.html(`
    <span class="tag" style="background:${GROUPS[d.g].c}">${GROUPS[d.g].name}</span>
    <h2>${d.title} <span style="color:var(--muted);font-weight:400">${d.spec}</span></h2>
    <div class="role">${d.role}</div>
    ${d.detail}
    <hr>
    <div class="kv"><b style="color:var(--blue)">IN ▸</b> ${ins.map(l=>`<span class="mono">${l.s}: ${l.lab}</span>`).join("<br>")||"—"}</div>
    <div class="kv" style="margin-top:6px"><b style="color:var(--rust)">OUT ▸</b> ${outs.map(l=>`<span class="mono">${l.t}: ${l.lab}</span>`).join("<br>")||"—"}</div>
  `);
}
function showLink(d){
  dimAll();
  linkSel.filter(x=>x===d).classed("dim-on",false).classed("hl",true);
  labSel.filter(x=>x===d).classed("dim-on",false);
  d3.select(".N-"+d.s).classed("dim-on",false).classed("hl",true);
  d3.select(".N-"+d.t).classed("dim-on",false).classed("hl",true);
  const s=byId[d.s], t=byId[d.t];
  panel.html(`
    <span class="tag" style="background:${MARK[d.type]}">${d.type.toUpperCase()} EDGE</span>
    <h2>${s.title} → ${t.title}</h2>
    <div class="kv mono" style="font-size:13px;color:var(--green);font-weight:600">${d.lab}</div>
    <hr>
    <div class="kv">${d.det}</div>
  `);
}
const panel = d3.select("#panel");
function resetPanel(){
  undimAll(); nodeSel.classed("hl",false); linkSel.classed("hl",false);
  panel.html(OVERVIEW);
}
const OVERVIEW = `
  <h2>KinoVLA — 数据流水线总览</h2>
  <div class="role">Hover a node or an edge for its precise schema. Two coupled pipelines:</div>
  <div class="kv"><b style="color:var(--blue)">① Online closed loop</b></div>
  <div class="kv mono" style="font-size:11.5px;line-height:1.7">Backend →<span class="dim"> Obs(12)</span><br>
  → Monitor →<span class="dim"> MonitorEvent</span> + anomaly_score<br>
  → Kino-Tokens <span class="dim">(25,11)→(6,96)</span> → μ̂ → Shield<br>
  → Projector <span class="dim">→ soft(6,2560)</span> → Qwen3-VL-4B<br>
  → <span class="dim">&lt;Thought&gt;/&lt;Action&gt;</span> → Parser → Compiler<br>
  → CBF Shield <span class="dim">(3,)→ξ∈ℝ²→u*∈ℝ²→(3,)</span> → execute ↺</div>
  <div class="kv" style="margin-top:8px"><b style="color:var(--blue)">② Offline training</b></div>
  <div class="kv mono" style="font-size:11.5px;line-height:1.7">Excite → Snapshot <span class="dim">{rgb(5,72,96,3),proprio(25,11),θ}</span><br>
  → Oracle (gpt-5.5) → CoTAnnotation<br>
  → Truth-Filter (vs GroundTruth) → Verdict<br>
  → Dataset <span class="dim">(samples.jsonl + frames.npz)</span><br>
  → Kino-SFT → Embodied DPO → deploy ↑</div>
  <hr>
  <div class="legend">
    <div class="kv" style="font-weight:700;color:#15233f">Subsystems</div>
    ${Object.values(GROUPS).map(g=>`<div class="lrow"><b style="background:${g.c}"></b>${g.name}</div>`).join("")}
    <div class="kv" style="font-weight:700;color:#15233f;margin-top:8px">Edges</div>
    <div class="lrow"><b style="background:${MARK.data}"></b>data flow</div>
    <div class="lrow"><b style="background:${MARK.feedback}"></b>execution feedback</div>
    <div class="lrow"><b style="background:${MARK.couple}"></b>μ̂ perception↔safety coupling</div>
    <div class="lrow"><b style="background:${MARK.control}"></b>control / gating</div>
    <div class="lrow"><b style="background:${MARK.train}"></b>training → deploy</div>
  </div>
  <hr>
  <div class="kv" style="color:var(--muted);font-size:11.5px">All shapes verified against source: window (25,11), Kino-Tokens (6,96), soft tokens (6,2560), Qwen3-VL hidden 2560, costmap (40,64), Snapshot rgb (5,72,96,3), θ-truth = {mu, payload_kg, effort_scale, support_ratio}.</div>
`;

// ---------- zoom / fit ----------
const zoom = d3.zoom().scaleExtent([0.25,3]).on("zoom",e=>root.attr("transform",e.transform));
svg.call(zoom);
function fit(){
  const b={x:-60,y:-20,w:2090,h:790};
  const sw=svg.node().clientWidth, sh=svg.node().clientHeight;
  const k=Math.min(sw/b.w, sh/b.h)*0.98;
  const tx=(sw-k*b.w)/2 - k*b.x, ty=(sh-k*b.h)/2 - k*b.y;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(k));
}
function filterLane(which){
  const show = id => which==="all" ? true : byId[id].lane===(which==="online"?"on":"off");
  nodeSel.style("display",d=>show(d.id)?null:"none");
  linkSel.style("display",d=>(show(d.s)&&show(d.t))?null:"none");
  labSel.style("display",d=>(show(d.s)&&show(d.t))?null:"none");
}
document.getElementById("b-all").onclick    = e=>{setActive(e.target);filterLane("all");};
document.getElementById("b-online").onclick = e=>{setActive(e.target);filterLane("online");};
document.getElementById("b-offline").onclick= e=>{setActive(e.target);filterLane("offline");};
document.getElementById("b-fit").onclick    = ()=>fit();
function setActive(b){document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("on"));b.classList.add("on");}

resetPanel();
window.addEventListener("resize",fit);
setTimeout(fit,60);
</script>
