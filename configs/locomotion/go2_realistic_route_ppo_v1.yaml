# Benchmark-specific Go2 policy for realistic Kino-Fail route collection.
# This artifact is isolated under outputs/locomotion/realistic_route_v1 and never
# overwrites the legacy policy used by the old A0-A7 stack.
task: "Isaac-Velocity-Flat-Unitree-Go2-v0"
num_envs: 4096
max_iterations: 1200
seed: 20261130
device: "cuda:0"
experiment_name: "go2_realistic_route_v1"
out_dir: "outputs/locomotion/realistic_route_v1"
export_filename: "policy.pt"

# Randomization supports nominal sim2real stability without trying to make the
# operator anomalies invisible. O1/O5/O6 formal doses remain outside or at the
# edge of these nuisance ranges and will be recalibrated against this policy.
dr:
  static_friction_range: [0.08, 1.25]
  dynamic_friction_range: [0.08, 1.0]
  restitution_range: [0.0, 0.05]
  add_base_mass_range: [-2.0, 3.0]
  enable_push: true
  push_interval_s: [8.0, 12.0]
  push_velocity_range: [-0.25, 0.25]

# Direct sustained commands match deployment. The narrow positive-vx envelope
# deliberately gives high density around the 0.18 m/s realistic route speed;
# v13 showed that a broad [-1,1] curriculum learns to ignore this low command.
command:
  heading_command: false
  lin_vel_x: [0.12, 0.40]
  lin_vel_y: [-0.22, 0.22]
  ang_vel_z: [-0.50, 0.50]
  rel_standing_envs: 0.0

rewards:
  track_lin_vel_xy_weight: 4.0
  track_ang_vel_z_weight: 1.5
  lin_vel_z_weight: -3.0
  ang_vel_xy_weight: -0.10
  flat_orientation_weight: -4.0
  action_rate_weight: -0.02
  feet_slide_weight: -0.18
  feet_air_time_weight: 0.35
