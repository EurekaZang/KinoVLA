# Kino-Fail realistic benchmark design.  This file compiles schedules only; an episode remains
# artifact_state=planned until Isaac runtime outputs and QA evidence are attached.
benchmark_id: kinofail_realistic_v1

corpus:
  # The 396-episode pilot spends its three scene replicates on three genuinely distinct scene
  # families per domain, rather than three deterministic seeds of one family.  The full corpus
  # then supplies five stochastic seeds inside every scene family.
  pilot_scene_families_per_domain: 3
  pilot_seeds: 1
  pilot_severities: 2
  full_seeds: 5
  full_severities: 3
  full_realizations: 2
  expected_pilot_records: 396
  expected_full_records: 5940

quality_gates:
  min_material_families_per_operator: 6
  # Every physical episode is rendered with three synchronized appearance views.  Full-split
  # cells currently contain two independent PBR families, so the third view revisits one family
  # with a different state/UV/photometric realization.
  min_material_families_per_texture_swap_group: 2
  min_operator_labels_per_material: 3
  min_scene_families_per_domain: 3
  max_operator_material_nmi: 0.02
  max_condition_material_nmi: 0.001

# Runtime promotion gates.  These are evaluated from the collected files themselves; a collector
# cannot declare an episode evaluation-eligible.  The 40 ms synchronization limit is below one
# 20 Hz RGB interval and is checked against the higher-rate proprioception clock.
runtime_quality_gates:
  min_rgb_frames: 5
  min_distinct_rgb_frames: 3
  # Mean |RGB_primary-RGB_swap| / 255 over synchronized frames.  This rejects a renderer cache
  # bug or an appearance intervention that changes metadata without visibly changing the image.
  min_mean_appearance_pair_rgb_l1: 0.015
  min_rgb_width: 320
  min_rgb_height: 180
  min_proprio_samples: 25
  min_proprio_features: 11
  max_rgb_proprio_skew_s: 0.04
  max_mean_highlight_fraction: 0.45
  max_frame_highlight_fraction: 0.90
  min_mean_luminance_std: 12.0
  min_scheduled_appearance_pixel_fraction: 0.10
  min_scene_context_pixel_fraction: 0.08
  parameter_abs_tolerance: 0.00001
  parameter_rel_tolerance: 0.01

# 70/20/10 follows the approved terrain recommendation.  The final tier is a LucidSim-style,
# geometry-conditioned sequence renderer; it must not be generated frame-by-frame.
render_tiers:
  structured_pbr_percent: 70
  pbr_decal_percent: 20
  generated_sequence_percent: 10

visual_randomization:
  uv_scale_range: [0.78, 1.32]
  rotation_deg: [0, 90, 180, 270]
  triplanar: true

# Rendering-only interventions.  They never change collision geometry, operator parameters,
# proprioception or telemetry.  All views are captured at the same simulated state/timestamp so
# the corpus can enforce prediction consistency under terrain texture swaps.
texture_swap_randomization:
  views_per_physical_episode: 3
  uv_offset_range: [0.0, 1.0]
  albedo_brightness_multiplier_range: [0.88, 1.12]
  normal_strength_range: [0.75, 1.25]
  roughness_multiplier_range: [0.82, 1.18]

# This gate is deliberately separate from attribution accuracy: a model can be consistently
# wrong.  A0-A7 still carry the task-performance claim; these thresholds only reject models whose
# decision changes when an appearance-only intervention is applied to the same physical evidence.
texture_swap_evaluation_gates:
  min_group_hard_prediction_consistency: 0.95
  min_pairwise_prediction_agreement: 0.95
  max_mean_pairwise_probability_jsd: 0.05

camera_profiles:
  - go2_front_calib_a
  - go2_front_calib_b
  - go2_front_calib_c

# Frozen engineering camera profiles used by the runtime collector.  These are deliberately kept
# separate from the schedule's profile IDs so the validator can compare the actual mount readback.
# They are not claimed as real-Go2 calibration; the release still requires a physical fixture
# calibration and will replace these values while invalidating all dependent runtime manifests.
camera_profile_specs:
  go2_front_calib_a:
    mount_xyz_m: [0.330, -0.004, 0.061]
    pitch_down_rad: 0.140
    focal_length_mm: 17.8
    width: 640
    height: 360
  go2_front_calib_b:
    mount_xyz_m: [0.335, 0.000, 0.065]
    pitch_down_rad: 0.180
    focal_length_mm: 18.0
    width: 640
    height: 360
  go2_front_calib_c:
    mount_xyz_m: [0.340, 0.004, 0.069]
    # The collector's first vertical slice showed that 0.220 rad pointed a low-mounted Go2
    # camera mostly at the floor.  Keep this engineering profile near-forward so both the
    # traversed surface and the room context remain observable; a physical fixture calibration
    # must still replace all three engineering profiles before release.
    pitch_down_rad: 0.100
    focal_length_mm: 18.2
    width: 640
    height: 360

appearance_states:
  life: [clean, dusty, scuffed, damp]
  production: [clean, dusty, oil_stained, wet]
  wild: [dry, damp, leaf_litter, muddy]

domains:
  life:
    scenes:
      - {id: indoor_workstudio_01, split: train, source: kino_authored_embodiedgen_interface}
      - {id: indoor_office_02, split: val, source: embodiedgen_v2_roomgen}
      - {id: indoor_garage_03, split: test, source: embodiedgen_v2_roomgen}
  production:
    scenes:
      - {id: warehouse_loading_01, split: train, source: embodiedgen_v2_assetgen}
      - {id: maintenance_bay_02, split: val, source: embodiedgen_v2_assetgen}
      - {id: assembly_corridor_03, split: test, source: embodiedgen_v2_assetgen}
  wild:
    scenes:
      - {id: forest_trail_01, split: train, source: audited_heightfield_plus_embodiedgen_shell}
      - {id: gravel_slope_02, split: val, source: audited_heightfield_plus_embodiedgen_shell}
      - {id: muddy_track_03, split: test, source: audited_heightfield_plus_embodiedgen_shell}

