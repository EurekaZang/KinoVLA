operators:
  - id: O1_mu_field
    category: low_friction
    physical_realizations: [physx_region_material, calibrated_surface_coupon]
    geometry_profiles: [irregular_material_region, irregular_material_region_alt]
    nominal: {mu_s: 0.80, mu_d: 0.60, restitution: 0.0}
    severities:
      - {id: mild, rank: 1, parameters: {mu_s: 0.38, mu_d: 0.32, restitution: 0.0}}
      - {id: moderate, rank: 2, parameters: {mu_s: 0.20, mu_d: 0.15, restitution: 0.0}}
      - {id: severe, rank: 3, parameters: {mu_s: 0.10, mu_d: 0.07, restitution: 0.0}}
  - id: O2_compliance
    category: compliant_terrain
    physical_realizations: [foot_terramechanics, calibrated_deformable_patch]
    geometry_profiles: [pressure_sinkage_field, deformable_mesh_patch]
    nominal: {sink_depth_m: 0.0, shear_gain: 1.0, stiffness_n_per_m: 0.0}
    severities:
      - {id: mild, rank: 1, parameters: {sink_depth_m: 0.025, shear_gain: 0.80, stiffness_n_per_m: 80.0}}
      - {id: moderate, rank: 2, parameters: {sink_depth_m: 0.060, shear_gain: 0.55, stiffness_n_per_m: 150.0}}
      - {id: severe, rank: 3, parameters: {sink_depth_m: 0.110, shear_gain: 0.32, stiffness_n_per_m: 240.0}}
  - id: O3_collapse
    category: region_collapse
    physical_realizations: [impulse_triggered_support_tile, damage_state_mesh_swap]
    geometry_profiles: [hidden_support_cells, breakable_surface_cells]
    nominal: {damage_threshold_ns: 1000000.0, drop_m: 0.0, residual_support: 1.0}
    severities:
      - {id: mild, rank: 1, parameters: {damage_threshold_ns: 75.0, drop_m: 0.025, residual_support: 0.72}}
      - {id: moderate, rank: 2, parameters: {damage_threshold_ns: 45.0, drop_m: 0.060, residual_support: 0.45}}
      - {id: severe, rank: 3, parameters: {damage_threshold_ns: 25.0, drop_m: 0.120, residual_support: 0.18}}
  - id: O4_tether
    category: adhesion
    physical_realizations: [adhesive_foot_contact, tether_entanglement]
    geometry_profiles: [irregular_protective_film, sparse_cable_loop]
    nominal: {attachment_enabled: 0.0, force_cap_n: 0.0, break_force_n: 0.0}
    severities:
      - {id: mild, rank: 1, parameters: {attachment_enabled: 1.0, force_cap_n: 28.0, break_force_n: 55.0}}
      - {id: moderate, rank: 2, parameters: {attachment_enabled: 1.0, force_cap_n: 48.0, break_force_n: 85.0}}
      - {id: severe, rank: 3, parameters: {attachment_enabled: 1.0, force_cap_n: 72.0, break_force_n: 120.0}}
  - id: O5_payload
    category: overload
    physical_realizations: [rigid_top_payload, asymmetric_side_payload]
    geometry_profiles: [visible_top_case, visible_side_case]
    nominal: {mass_kg: 0.0, com_offset_x_m: 0.0, com_offset_y_m: 0.0}
    severities:
      - {id: mild, rank: 1, parameters: {mass_kg: 3.0, com_offset_x_m: 0.00, com_offset_y_m: 0.00}}
      - {id: moderate, rank: 2, parameters: {mass_kg: 8.0, com_offset_x_m: 0.08, com_offset_y_m: 0.00}}
      - {id: severe, rank: 3, parameters: {mass_kg: 14.0, com_offset_x_m: 0.12, com_offset_y_m: 0.06}}
  - id: O6_push
    category: external_push
    physical_realizations: [finite_duration_wrench, padded_dynamic_collision]
    geometry_profiles: [clear_corridor, moving_soft_object]
    nominal: {impulse_ns: 0.0, duration_s: 0.12, application_point_body_m: [0.0, -0.085, 0.075]}
    severities:
      - {id: mild, rank: 1, parameters: {impulse_ns: 2.0, duration_s: 0.12, application_point_body_m: [0.0, -0.085, 0.075]}}
      - {id: moderate, rank: 2, parameters: {impulse_ns: 6.0, duration_s: 0.12, application_point_body_m: [0.0, -0.085, 0.075]}}
      - {id: severe, rank: 3, parameters: {impulse_ns: 12.0, duration_s: 0.12, application_point_body_m: [0.0, -0.085, 0.075]}}
  - id: O7_visual_remap
    category: low_friction
    physical_realizations: [appearance_physics_swap, timestamped_depth_bias]
    geometry_profiles: [same_surface_counterfactual, same_surface_counterfactual_alt]
    nominal: {mu_s: 0.80, mu_d: 0.60, depth_bias_m: 0.0}
    severities:
      - {id: mild, rank: 1, parameters: {mu_s: 0.36, mu_d: 0.30, depth_bias_m: 0.08}}
      - {id: moderate, rank: 2, parameters: {mu_s: 0.18, mu_d: 0.13, depth_bias_m: 0.18}}
      - {id: severe, rank: 3, parameters: {mu_s: 0.09, mu_d: 0.06, depth_bias_m: 0.32}}
  - id: O8_invisible_collider
    category: invisible_obstacle
    physical_realizations: [transparent_acrylic, occluded_low_bar]
    geometry_profiles: [transparent_panel, low_contrast_bar]
    counterfactual_inherit: [obstacle_height_m, optical_transmission]
    nominal: {collision_enabled: 0.0, obstacle_height_m: 0.38, optical_transmission: 0.88}
    severities:
      - {id: mild, rank: 1, parameters: {collision_enabled: 1.0, obstacle_height_m: 0.38, optical_transmission: 0.88}}
      - {id: moderate, rank: 2, parameters: {collision_enabled: 1.0, obstacle_height_m: 0.38, optical_transmission: 0.94}}
      - {id: severe, rank: 3, parameters: {collision_enabled: 1.0, obstacle_height_m: 0.38, optical_transmission: 0.98}}
  - id: O9_high_centering
    category: high_centering
    physical_realizations: [rounded_ridge, pallet_edge]
    geometry_profiles: [cross_path_log_or_pipe, cross_path_pallet_edge]
    nominal: {ridge_height_m: 0.0, ridge_width_m: 0.0, residual_support: 1.0}
    severities:
      - {id: mild, rank: 1, parameters: {ridge_height_m: 0.13, ridge_width_m: 0.20, residual_support: 0.72}}
      - {id: moderate, rank: 2, parameters: {ridge_height_m: 0.18, ridge_width_m: 0.24, residual_support: 0.46}}
      - {id: severe, rank: 3, parameters: {ridge_height_m: 0.23, ridge_width_m: 0.28, residual_support: 0.22}}
  - id: O10_effort_decay
    category: effort_decay
    physical_realizations: [whole_body_torque_derate, single_leg_torque_derate]
    geometry_profiles: [clear_corridor, clear_corridor_alt]
    nominal: {effort_floor: 1.0, decay_rate_per_s: 0.0, onset_s: 1000000.0}
    severities:
      - {id: mild, rank: 1, parameters: {effort_floor: 0.62, decay_rate_per_s: 0.35, onset_s: 2.0}}
      - {id: moderate, rank: 2, parameters: {effort_floor: 0.40, decay_rate_per_s: 0.60, onset_s: 1.5}}
      - {id: severe, rank: 3, parameters: {effort_floor: 0.20, decay_rate_per_s: 0.90, onset_s: 1.0}}
  - id: O11_obs_bias
    category: obs_bias
    physical_realizations: [imu_bias_random_walk, odometry_latency_dropout]
    geometry_profiles: [clear_corridor, clear_corridor_alt]
    nominal: {tilt_bias_rad: 0.0, random_walk_rad_sqrt_s: 0.0, latency_s: 0.0}
    severities:
      - {id: mild, rank: 1, parameters: {tilt_bias_rad: 0.08, random_walk_rad_sqrt_s: 0.004, latency_s: 0.04}}
      - {id: moderate, rank: 2, parameters: {tilt_bias_rad: 0.18, random_walk_rad_sqrt_s: 0.010, latency_s: 0.10}}
      - {id: severe, rank: 3, parameters: {tilt_bias_rad: 0.35, random_walk_rad_sqrt_s: 0.020, latency_s: 0.20}}
