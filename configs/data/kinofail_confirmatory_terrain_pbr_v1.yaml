# All 30 ambientCG source assets are disjoint from the material sources used by
# the development/replication corpora.  Metric dimensions were queried from the
# official ambientCG v2 metadata API on 2026-07-25.  DiamondPlate009 reports
# 0 x 0 cm upstream, so its metric UV basis is explicitly frozen to 1 x 1 m
# instead of silently inferring scale from the rendered image.
