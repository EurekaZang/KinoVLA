# Scripted FSM recovery stub (kino_vla/vla/fsm_recovery.py).
cruise_speed_mps: 0.8
approach_slowdown_m: 0.5
waypoint_tol_m: 0.25
heading_gain: 2.0
align_angle_rad: 0.7     # turn in place above this heading error before driving
cmd_slew_mps2: 1.2       # keeps nominal tracking error under the monitor threshold
yaw_slew_radps2: 6.0
# In-place Turn primitive (NOMINAL nav): a PURE yaw rotation (vx=vy=0); the surrogate integrates wz
# into heading directly, so it rotates in place. turn_tol_rad/turn_max_s mirror the Isaac config.
turn_rate_radps: 1.0
turn_tol_rad: 0.12
turn_max_s: 4.0
event_grace_s: 1.5       # ignore events right after a replan (turn-in-place transient)
backstep:
  speed_mps: 0.25
  duration_s: 4.0   # long enough to brake out of the slide and fully exit the patch
avoid:
  radius_m: 1.8          # avoid-circle radius marked at the event position
  clearance_m: 0.4
  growth: 1.5            # radius multiplier when the same region triggers again

# Active-sensing probe (Gap-3 #34c) — DISABLED on the surrogate: it has no train/deploy proprio
# shift (the surrogate point-robot's window is not standardizer-OOD), and keeping it off preserves
# the pinned walking-skeleton demo trajectory hash. The probe is an Isaac-physics deployment tool.
probe:
  enabled: false
