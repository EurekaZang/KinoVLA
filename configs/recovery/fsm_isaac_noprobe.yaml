# Gap-3 ABLATION config: identical to recovery/fsm_isaac.yaml but with the active-sensing probe
# DISABLED. Used to measure the probe's effect on closed-loop attribution — without it the smooth
# deploy proprioception window is OOD for the bang-bang-fit projector standardizer, so the
# attribution collapses (#34c). Everything else (cruise, avoid, backstep) is identical so the
# comparison is ceteris paribus.
cruise_speed_mps: 0.8
approach_slowdown_m: 0.5
waypoint_tol_m: 0.3
heading_gain: 2.0
align_angle_rad: 0.7
cmd_slew_mps2: 1.2
yaw_slew_radps2: 6.0
event_grace_s: 9.0
backstep:
  speed_mps: 0.25
  duration_s: 3.0
avoid:
  radius_m: 3.0
  clearance_m: 0.4
  growth: 1.0

probe:
  enabled: false  # the ablation: no active-sensing maneuver before the VLA reads the snapshot
  decel_s: 0.25
  accel_s: 0.25
  lo_mps: 0.1
  hi_mps: 0.8
  settle_window_ms: 500.0
