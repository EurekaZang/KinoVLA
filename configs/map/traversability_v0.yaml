# Semantic traversability map (spec §7; kino_vla/map). Surrogate perception tier
# (CLAUDE.md deviation #16): CLIP/SAM stand-ins, costmap geometry, propagation/hazard
# thresholds. No magic numbers in module code (QA 5.5) — all map behaviour is here.

# Perception front-end (clip | rgbd | surrogate). The CODE DEFAULT is real CLIP
# (TraversabilityMap.DEFAULT_SEGMENTER, spec §7). This is the SHARED config loaded by the CI fast
# tests, the surrogate walking-skeleton demo (scripts/run_demo.py / tests/test_demo.py) and
# tests/test_map.py — none of which have a GPU / HF-model budget — so it pins 'surrogate' to keep
# the demo gate green (CLAUDE.md QA 5.1). The Isaac CLIP demos load this config with a
# {'segmenter': 'clip'} override (real open-vocab CLIP, 512-d features).
segmenter: surrogate

costmap:
  resolution_m: 0.25      # grid cell size
  extent: [16.0, 10.0]    # odometry-frame walkable area (matches demo terrain extent)

camera:
  fov_rad: 1.5708         # 90° horizontal field of view
  max_range_m: 5.0        # back-projection range gate (SurrogateSegmenter centre-in-cone gate)
  # Real RGB-D pinhole back-projection (kino_vla/map/rgbd.py, RgbdSegmenter — spec §7).
  # Live RTX camera is hardware-blocked here (CLAUDE.md §6 #24/#26), so the same intrinsics
  # drive a procedural ground-plane RGB-D render; a working-RTX camera feed is a drop-in.
  image_width: 96         # render/intrinsics resolution
  image_height: 72
  mount_height_m: 0.45    # camera height over the body (≈ Go2 trunk-mounted RGB-D)
  pitch_rad: 0.6          # downward tilt so the ground ahead fills the frame (~34°)
  encoder_bins: 4         # PixelAppearanceEncoder bins; bins**3 must equal costmap EMBED_DIM (64)

# Physical-failure overwrite (high-confidence, sticky):
failure_cost: 1.0         # cost stamped at an attributed failure site
failure_radius_m: 0.6     # disc radius around the site (covers the contact footprint)

# CLIP-similarity label propagation to visually-homogeneous neighbours:
propagation_sim_threshold: 0.9   # cosine-similarity bar to count as "same surface"
propagation_cost: 0.8            # cost raised on propagated (not directly-stepped) cells

# Planner hand-off (map crop + avoid discs):
crop_half_extent_m: 4.0    # half-size of the local map window served to the planner
hazard_threshold: 0.5      # cells above this cost become avoid discs
hazard_merge_radius_m: 1.0 # greedy single-link cluster radius for disc merging
