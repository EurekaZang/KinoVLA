# Isaac Lab walking-skeleton backend (kino_vla/sim/isaac_backend.py) — M1 tier.
# The Go2 root is driven kinematically through the same traction model as the
# surrogate until the M2 locomotion policy lands (CLAUDE.md Section 6 issue #5).
physics_dt: 0.005        # 200 Hz physics
control_hz: 50           # -> decimation 4
device: "cuda:0"
mass_fallback_kg: 15.0   # used only if the PhysX mass query API differs (verify on 5090)
yaw_inertia_kgm2: 0.65
max_speed_mps: 1.0
max_yaw_rate_radps: 1.5
# Traction model — keep in sync with configs/sim/surrogate.yaml so both backends
# present the same closed-loop dynamics to the monitor/FSM at M1.
tau_track_s: 0.25
tau_yaw_s: 0.15
gravity: 9.81
mu_nominal: 0.8
gait_demand_per_speed: 3.0
patch_thickness_m: 0.02  # O1 patch collider plate height
fall_check:
  min_base_height_m: 0.18
  max_tilt_rad: 0.6
