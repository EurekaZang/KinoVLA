# Isaac Lab walking-skeleton backend (kino_vla/sim/isaac_policy_backend.py) — M2 tier.
# The Go2 is physically simulated and walked by the trained RSL-RL velocity policy
# (scripts/train_locomotion.py); the M1 kinematic root drive is retired.
physics_dt: 0.005        # 200 Hz physics
control_hz: 50           # -> decimation 4 (matches the policy's training control rate)
device: "cuda:0"
mass_fallback_kg: 15.0   # used only if the PhysX mass query API differs
yaw_inertia_kgm2: 0.65
max_speed_mps: 1.0
max_yaw_rate_radps: 1.5
gravity: 9.81
mu_nominal: 0.8
patch_thickness_m: 0.006  # O1 patch collider plate height (thin: a gentle lip for the walker)
wall_height_m: 0.8        # O8 invisible-collider wall height (taller than the Go2 body)
ridge_height_m: 0.10      # O9 high-centering ridge: climbable lip that lifts the chassis
                          # (a taller step the trot just rams into and stalls against)

# M2 policy backend (kino_vla/sim/isaac_policy_backend.py)
policy_path: "outputs/locomotion/policy.pt"   # exported JIT actor (gitignored)
action_scale: 0.5         # env JointPositionAction scale (joint_target = default + 0.5*action)
settle_steps: 10          # zero-command steps to settle the stance before the episode
slip_force_threshold_n: 2.0  # net foot contact force above which a foot counts as load-bearing
slip_ref_speed_mps: 0.30  # load-bearing-foot horizontal speed that maps to slip_ratio = 1
effort_limit_nm: 23.5     # Go2 DCMotor effort limit (for the measured effort-saturation channel)
effort_sat_floor: 0.7     # torque fraction below which effort_ratio reads 0 (nominal walking)
# Fall detection is primarily the env's own base_contact termination (authoritative);
# these are backstops for a near-ground collapse / topple that hasn't contacted yet.
# The trained policy trots low (~0.13 m base), so the height backstop sits well under it.
fall_check:
  min_base_height_m: 0.07
  max_tilt_rad: 0.8
# Closed-loop BODY-POSTURE controller (#41): a residual blended onto the policy's joint targets,
# I-controlled on the measured trunk height, so Switch_Gait/Adjust_Posture/Set_Constraint each drive
# a real, distinct, precisely-tracked body height on the physical Go2 (the M2 Reflex made real on
# Isaac — set_reflex was a no-op). flex_dir = the action-space leg-extension direction that RAISES
# the trunk (calf straightens, thigh folds back); sign flips it if the measured response inverts.
# Gains/targets are calibrated by scripts/isaac_posture_check.py against the real measured height.
posture:
  brace_height_m: 0.18      # §6.8 brace stance the shield-fallback Reflex crouches to (set_reflex)
  alpha_gain: 6.0           # I-control gain on (target - measured height) per control step
  alpha_max: 1.2            # clamp on the flex residual magnitude (policy action units)
  thigh_gain: -0.6          # action-space delta on thigh joints to RAISE the trunk
  calf_gain: 1.0            # action-space delta on calf joints to RAISE the trunk (straighten knee)
  sign: 1.0                 # global flip if the measured height response is inverted (calibration)
  release_decay: 0.80       # residual decay per step when posture is released (smooth return)
  speed_scale: 0.5          # cap forward speed while actively holding a posture (stability)
# Recording camera (scripts/record_demo.py; passive sensor, off by default)
cam_height: 640
cam_width: 960
