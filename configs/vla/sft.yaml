# Kino-SFT config (spec §11 Stage 1; M7). LoRA fine-tune Qwen3-VL-4B + the Kino-Projector on the
# truth-filtered Hindsight-CoT dataset. Backbone is Qwen3-VL-4B (CLAUDE.md §6 #33 — the latest Qwen
# VLM; supersedes the spec's Qwen2-VL), sized 4B + LoRA for the 32 GB RTX 5090. No magic numbers in
# code (QA 5.1.5): every knob lives here, and the run is reproducible from this file + the seed.

# latent (route B, spec §3): Kino-Tokens injected via the projector. "text" (route B4 ablation):
# the proprioception is in the prompt text and the projector/latent path is off.
route: latent

model:
  model_id: Qwen/Qwen3-VL-4B-Instruct
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    # LoRA on the language tower's attention + MLP projections (matched by suffix).
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Kino-Projector / §4 tokenizer (mirrors configs/tokens/extractor_v0.yaml so it can init from M4).
projector:
  conv_channels: [48, 48]
  conv_kernels: [5, 3]
  latent_dim: 96
  n_latents: 6        # K soft tokens spliced at <kino_tokens>
  n_heads: 4
  mlp_hidden: 96
  proj_hidden: 512    # the Kino-Projector MLP hidden (latent_dim -> proj_hidden -> vlm_dim)
  std_eps: 1.0e-3

data:
  dataset_dir: outputs/hindsight_isaac   # the real-Go2 + gpt-5.5 + filter dataset (M6)
  split_seed: 0
  val_frac: 0.12
  test_frac: 0.12
  n_images: 1         # attach the most-recent rendered RGB frame (cost/VRAM control)

train:
  seed: 0
  lr: 1.0e-4
  weight_decay: 0.0
  epochs: 4
  grad_accum: 8       # effective batch (per-sample forward; multimodal padding avoided)
  grad_clip: 1.0
  theta_loss_weight: 0.1   # privileged-θ grounding (spec §4); 0 disables it
