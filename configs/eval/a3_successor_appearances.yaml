# A3-successor method-development library.  The original frozen test decals remain untouched;
# two disjoint train decals provide nominal O7-reverse windows under the identical bang-bang drive.
meta:
  spec: "A3 successor reverse-conflict calibration; never used as confirmatory evidence"
  canonical: {adhesion: yellow_board, compliant_terrain: brown_mud, low_friction: ice_sheet}

classes:
  adhesion:
    - {id: yellow_board, rgb: [0.90, 0.80, 0.18], base_material: adhesive, split: train}
    - {id: amber_adhesive, rgb: [0.85, 0.66, 0.14], base_material: adhesive, split: train}
    - {id: gray_tape, rgb: [0.60, 0.58, 0.52], base_material: adhesive, split: test}
    - {id: checker_decal, rgb: [0.74, 0.68, 0.24], base_material: adhesive, split: test}
    - {id: translucent_sheet, rgb: [0.82, 0.84, 0.72], base_material: adhesive, split: test}
  compliant_terrain:
    - {id: brown_mud, rgb: [0.42, 0.28, 0.14], base_material: mud, split: train}
    - {id: dark_gray_mud, rgb: [0.30, 0.28, 0.26], base_material: mud, split: train}
    - {id: reddish_mud, rgb: [0.52, 0.27, 0.17], base_material: mud, split: test}
    - {id: wet_sheen_mud, rgb: [0.36, 0.31, 0.24], base_material: mud, split: test}
  low_friction:
    - {id: ice_sheet, rgb: [0.80, 0.88, 0.98], base_material: ice, split: train}
    - {id: clear_frost, rgb: [0.86, 0.90, 0.93], base_material: ice, split: train}
    - {id: gray_ice, rgb: [0.66, 0.73, 0.80], base_material: ice, split: test}
  solid_ground:
    - {id: solid_ground, rgb: [0.50, 0.50, 0.50], base_material: solid_ground, split: train}
    - {id: concrete_speckle, rgb: [0.55, 0.54, 0.52], base_material: solid_ground, split: train}
    - {id: pale_concrete, rgb: [0.60, 0.60, 0.58], base_material: solid_ground, split: test}
    - {id: dark_asphalt, rgb: [0.38, 0.38, 0.40], base_material: solid_ground, split: test}
  hazard_decal_benign:
    - {id: hazard_decal_orange_train, rgb: [0.95, 0.48, 0.08], base_material: adhesive, split: train}
    - {id: hazard_decal_blue_train, rgb: [0.12, 0.35, 0.90], base_material: adhesive, split: train}
    - {id: hazard_decal_yellow, rgb: [0.90, 0.80, 0.18], base_material: adhesive, split: test}
    - {id: hazard_decal_red, rgb: [0.80, 0.28, 0.20], base_material: adhesive, split: test}
