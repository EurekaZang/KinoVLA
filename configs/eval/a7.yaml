experiment: A7
output_dir: outputs/eval/a7

seeds:
  train: [0, 1, 2]
  split_seed: 0
  eval_seed: 0

statistics:
  ci: wilson
  ci_level: 0.95
  bootstrap_n: 2000
  mcnemar: exact_two_sided

sources:
  a0_corpus: outputs/eval/a0/corpus
  a2_headline: outputs/eval/a2/headline.json
  a2_per_item: outputs/eval/a2/per_item.json
  a2_conflict_dataset: outputs/eval/a2/sft_conflict_heldout
  a3_battery: outputs/eval/a3/a3_battery.json
  a3_dir: outputs/eval/a3
  a3_corpus_t3: outputs/eval/a3/corpus_t3
  a3_conflict_dataset: outputs/eval/a3/sft_conflict_bi
  hindsight_filtered: outputs/hindsight_isaac
  a4_results: outputs/eval/a4/a4_results.json
  a5_ood_theta: outputs/eval/a5/a5_4_ood_theta.json
  a5_risk_coverage: outputs/eval/a5/a5_5_risk_coverage.json
  a6_theta_sweep: outputs/eval/a6/a6_1_theta_sweep.json
  a6_eval: outputs/eval/a6/a6_eval.json

text_schemas:
  latent:
    route: latent
    proprio_detail: binned
    adapter: outputs/eval/a3/b5_conflict_bi/adapter_best
    description: latent Kino-token route with the bidirectional conflict model
  reflect_scalar:
    route: text
    proprio_detail: scalar
    adapter: outputs/eval/a2/b_text/adapter_best
    description: REFLECT-style sustained means text route
  rich_stats:
    route: text
    proprio_detail: rich
    adapter: outputs/eval/a7/adapters/text_schema/seed0/rich_stats/adapter_best
    description: rich per-channel/window statistics text route

conflict_doses:
  matched_samples: [0, 5, 10, 20, 40]
  operators: [O4_tether, O2_compliance]
  metric: O4_conflict_attribution
  nested: true
  train_appearances:
    O4_tether: [yellow_board, amber_adhesive]
    O2_compliance: [brown_mud, dark_gray_mud]

cot_filter:
  variants: [truth_filtered, unfiltered]
  oracle_sources: [api_oracle, scripted]
  rationale_grounding:
    require_evidence_keyword: true
    privileged_theta_check: true

encoder:
  variants:
    privileged_distillation:
      theta_loss_weight: 0.1
      contrastive: true
      from_scratch: false
    contrastive_only:
      theta_loss_weight: 0.0
      contrastive: true
      from_scratch: false
    from_scratch:
      theta_loss_weight: 0.0
      contrastive: false
      from_scratch: true
  window_lengths: [25, 50, 100]
  anomaly_gate: [true, false]
  corpus_dirs: [outputs/eval/a0/corpus, outputs/eval/a3/corpus_t3]
  epochs: 120
  batch_size: 64
  lr: 0.001
  test_frac: 0.25

addons:
  ers_regret: true
  ood_theta_abstention: true
  theta_star_residual: true

reporting:
  require_commit: true
  require_config_hash: true
  require_source_hashes: true
  note_addons_not_core_claims: true
