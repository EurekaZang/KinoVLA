experiment: A5.6-C4-final-v2
purpose: untouched confirmatory validation for the frozen supported structured gate v2
frozen_before_collection: true
frozen_date: 2026-07-19
gate_config: eval/c4_structured_gate_v2.yaml
appearance_split: final
seed_base: 1200

# Additive IDs unseen by VLA training, gate fitting, and all earlier evaluations.  This suite tests
# the pre-registered C4 scope: new appearances inside the calibrated material family, while the
# gate must abstain on new adhesion/ice/solid families.  The earlier arbitrary red/green semantic
# remapping remains an out-of-support development stress test and is not relabelled as final.
classes:
  adhesion:
    - {id: c4v2_gold_film, rgb: [0.82, 0.70, 0.25], base_material: adhesive}
    - {id: c4v2_silver_tape, rgb: [0.66, 0.64, 0.58], base_material: adhesive}
  compliant_terrain:
    - {id: c4v2_rust_loam, rgb: [0.46, 0.31, 0.17], base_material: mud}
    - {id: c4v2_charcoal_mud, rgb: [0.34, 0.31, 0.27], base_material: mud}
  low_friction:
    - {id: c4v2_pale_blue_ice, rgb: [0.68, 0.82, 0.94], base_material: ice}
    - {id: c4v2_lavender_frost, rgb: [0.72, 0.74, 0.90], base_material: ice}
  solid_ground:
    - {id: c4v2_warm_concrete, rgb: [0.55, 0.53, 0.50], base_material: solid_ground}
    - {id: c4v2_cool_asphalt, rgb: [0.42, 0.46, 0.52], base_material: solid_ground}

collection:
  main_seed_counts:
    matched_O4: 24
    matched_O2: 30
    O1_A_nominal: 12
    O2_A_nominal: 10
    O5_payload_B: 12
    O10_decay_B: 12
    O8_invisible: 12
  o7_mu_sweep: [0.6, 0.3, 0.15, 0.09]
  o7_seeds_per_cell: 8
  expected_main_snapshots: 224
  expected_t3_snapshots: 64
  expected_total_snapshots: 288

statistics:
  primary_comparator: always_safe
  minimum_coverage: 0.10
  paired_two_stage_bootstrap_reps: 2000
  success_gate: ci_upper_lt_zero

